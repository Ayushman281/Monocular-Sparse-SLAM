services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_REVISION: ${APP_REVISION:-unrecorded}
    env_file: .env
    environment:
      API_HOST: 0.0.0.0
      JOB_ROOT: /tmp/slam-jobs
      SLAM_RUNNER: /opt/slam/bin/slam_runner
      SLAM_VOCAB: /opt/slam/share/orb_vocab.fbow
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=3g,mode=1777
    shm_size: 128mb
    pids_limit: 256
    mem_limit: 6g
    cpus: 4.0
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Intentionally no host mapping for port 8000.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["80:80"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
